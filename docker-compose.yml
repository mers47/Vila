services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lead}
      POSTGRES_USER: ${POSTGRES_USER:-lead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lead} -d ${POSTGRES_DB:-lead}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly yes
      - --maxmemory-policy noeviction
      - --maxmemory 256mb
      - --save 900 1
      - --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 256M

  migrate:
    build:
      context: ./backend
      target: runtime
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    init: true
    stop_grace_period: 30s
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend, edge]
    deploy:
      resources:
        limits:
          memory: 512M

  worker-control:
    init: true
    stop_grace_period: 60s
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO", "--queues=control", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 256M

  worker-outbound:
    init: true
    stop_grace_period: 60s
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO", "--queues=outbound", "--concurrency=4"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 256M

  worker-discovery:
    init: true
    stop_grace_period: 60s
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=INFO", "--queues=discovery", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 256M

  beat:
    init: true
    stop_grace_period: 30s
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 128M

  test:
    build:
      context: ./backend
      target: test
    env_file: .env
    profiles: ["tools"]
    networks: [backend]

  dashboard:
    init: true
    stop_grace_period: 30s
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /tmp:/tmp
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_started
    networks: [edge]
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    internal: true
  edge: