[project]
name = "lead-platform-backend"
version = "2.0.0"
description = "Production lead generation, compliant outreach, CRM and sales handoff backend"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy[asyncio]==2.0.52",
  "asyncpg==0.30.0",
  "alembic==1.19.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "httpx[http2]==0.28.1",
  "redis==6.4.0",
  "celery==5.6.3",
  "PyJWT[crypto]==2.13.0",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.20",
  "email-validator==2.2.0",
  "orjson==3.11.2",
  "structlog==25.4.0",
  "tenacity==9.1.2",
  "beautifulsoup4==4.13.4",
  "lxml==6.0.0",
  "prometheus-client==0.22.1",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1"
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.9"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
